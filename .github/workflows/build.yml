name: Build installer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Download ffmpeg
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_build
          Copy-Item "ffmpeg_build/ffmpeg-master-latest-win64-gpl/bin/ffmpeg.exe" -Destination "ffmpeg.exe"
      - name: Build VideoGenerator.exe (PyInstaller)
        run: pyinstaller --onefile --windowed --name VideoGenerator app.py
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v1.0.0 "Output/VideoGenerator-Setup.exe" --title "Генератор відео v1.0.0" --notes "Інсталятор готово." || gh release upload v1.0.0 "Output/VideoGenerator-Setup.exe" --clobber
