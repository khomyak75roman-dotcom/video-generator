:: 1. Установити залежності (у папці проєкту)
pip install -r requirements.txt pyinstaller

:: 2. Завантажити ffmpeg.exe і покласти поруч з app.py
::    → https://www.gyan.dev/ffmpeg/builds/  (release-essentials, zip)
::    всередині bin\ffmpeg.exe → переіменувати на ffmpeg.exe у папку проєкту

:: 3. Зібрати один .exe
pyinstaller --onefile --windowed --name VideoGenerator --collect-all customtkinter app.py

:: 4. Встановити Inno Setup → відкрити installer.iss → Compile (F9)
::    → у папці project з'явиться VideoGenerator-Setup.exe — ГОТОВИЙ ІНСТАЛЯТОР
